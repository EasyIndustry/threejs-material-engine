<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Material engine</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #1b1b1f; font: 12px system-ui, sans-serif; color: #ddd; }
    #estado { position: absolute; left: 12px; top: 10px; }
  </style>
</head>
<body>
  <div id="estado">horneando…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { createMaterialEngine } from '../adapters/three/engine.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1b1b1f');
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.8;
    const sol = new THREE.DirectionalLight('#ffffff', 1.5);
    sol.position.set(3, 5, 4);
    scene.add(sol);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 3.2, 9.5);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

    // una imagen hecha acá mismo, para probar las capas de imagen sin archivos
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#e8e2d6'; g.fillRect(0, 0, 256, 256);
    g.fillStyle = '#2f5d8a'; g.font = 'bold 120px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('CAD', 128, 132);
    const logo = c.toDataURL();

    const motor = createMaterialEngine(renderer);
    const MATERIALES = {
      'chapa pintada con raspones': {
        resolution: 512,
        channels: { baseColor: '#9b2d20', roughness: 0.45, metalness: 0, bump: [{ generator: 'noise', params: { scale: 60 }, opacity: 0.3 }] },
        // raspones: ruido con un umbral fuerte (remap) como máscara de una capa de metal debajo de la pintura
        layers: [{ name: 'raspones', mask: { generator: 'noise', params: { scale: 5, octaves: 6, seed: 2 }, remap: [-30, 18.6] }, channels: { baseColor: '#9aa0a6', metalness: 1, roughness: 0.28 } }],
      },
      'metal cepillado': {
        resolution: 512,
        channels: { baseColor: '#c9ccd0', metalness: 1, roughness: { value: 0.32, layers: [{ generator: 'brushed', params: { scale: 400 }, blend: 'overlay', opacity: 0.8 }] }, anisotropy: 0.6 },
      },
      'chapa perforada': {
        resolution: 512, alphaMode: 'mask', doubleSided: true,
        channels: { baseColor: '#6f7378', metalness: 1, roughness: 0.4, alpha: [{ generator: 'dots', params: { count: 12, radius: 0.32, stagger: true }, invert: true }] },
      },
      baldosas: {
        resolution: 512, bumpStrength: 4,
        channels: {
          // la pastina: una capa de color con la junta como máscara
          baseColor: { value: '#d9d4c8', layers: [{ generator: 'noise', params: { scale: 30 }, blend: 'overlay', opacity: 0.25 }, { color: '#7a6f60', mask: { generator: 'tiles', params: { columns: 4, rows: 4, stagger: 0, gap: 0.05 }, invert: true } }] },
          roughness: [{ generator: 'tiles', params: { columns: 4, rows: 4, stagger: 0, gap: 0.05 }, remap: [0.9, 0.2] }],
          bump: [{ generator: 'tiles', params: { columns: 4, rows: 4, stagger: 0, gap: 0.05, bevel: 0.08 } }],
        },
      },
      'tira LED': {
        resolution: [512, 64],
        // la textura es 8:1: repeat lleva los puntos a 16 × 2 redondos
        channels: { baseColor: '#222222', roughness: 0.3, emissive: [{ generator: 'dots', params: { count: 1, radius: 0.35 }, transform: { repeat: [16, 2] }, tint: '#ffd08a' }] },
        emissiveIntensity: 6,
      },
      'vidrio esmerilado': {
        resolution: 256,
        channels: { baseColor: '#ffffff', metalness: 0, transmission: 1, thickness: 0.5, roughness: { value: 0.25, layers: [{ generator: 'noise', params: { scale: 40 }, blend: 'add', opacity: 0.2 }] } },
        ior: 1.5, attenuationColor: '#cfe8e0', attenuationDistance: 2,
      },
      'plástico texturado': {
        resolution: 512, bumpStrength: 2,
        channels: { baseColor: '#2a6f4e', roughness: 0.55, clearcoat: 0.6, clearcoatRoughness: 0.1, bump: [{ generator: 'grain', params: { scale: 160, density: 0.6, size: 0.4 } }] },
      },
      'imagen como capa': {
        resolution: 256,
        channels: { baseColor: [{ image: logo, transform: { repeat: [2, 1] } }], roughness: 0.6 },
      },
    };

    const nombres = Object.keys(MATERIALES);
    const t0 = performance.now();
    const listos = {};
    for (const [i, nombre] of nombres.entries()) {
      const mat = await motor.material(MATERIALES[nombre]);
      listos[nombre] = mat;
      const x = (i % 4 - 1.5) * 2.4, z = Math.floor(i / 4) * 2.6 - 1.3;
      const geo = nombre === 'tira LED' ? new THREE.BoxGeometry(1.8, 0.25, 0.25) : nombre === 'chapa perforada' ? new THREE.PlaneGeometry(1.6, 1.6) : new THREE.SphereGeometry(0.8, 64, 32);
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, 0.2, z);
      m.name = nombre;
      scene.add(m);
    }
    // desplazamiento: necesita una malla densa
    const desplazado = await motor.material({ resolution: 256, displacementScale: 0.25, channels: { baseColor: '#b8a58a', roughness: 0.8, displacement: [{ generator: 'cells', params: { scale: 5 }, invert: true }] } });
    const plano = new THREE.Mesh(new THREE.PlaneGeometry(9, 2.2, 200, 50), desplazado);
    plano.rotation.x = -Math.PI / 2;
    plano.position.set(0, -1, 0.3);
    plano.name = 'desplazamiento';
    scene.add(plano);

    const estado = document.getElementById('estado');
    estado.textContent = `${nombres.length + 1} materiales horneados en ${Math.round(performance.now() - t0)} ms — ${JSON.stringify(motor.stats())}`;
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
    Object.assign(window, { THREE, motor, scene, camera, controls, renderer, MATERIALES, listos, listo: true });
  </script>
</body>
</html>
